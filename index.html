<!doctype html>
<html lang="fa" dir="rtl" data-t="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0d0c">
<title>Watch Party</title>
<style>
:root{--bg:#f3faf5;--card:#eaf0eb;--bd:#c9d1cb;--tx:#101512;--mut:#5a665f;--ac:#1b8048;--acs:#d4f1e0;--me:#1b8048;--ease:cubic-bezier(.32,.72,0,1)}
[data-t=dark]{--bg:#0a0d0c;--card:#111716;--bd:#2a3330;--tx:#e6ece8;--mut:#8a958f;--ac:#4de08f;--acs:#0c3f45;--me:#1f6f48}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"SF Pro Text",Vazirmatn,Tahoma,sans-serif;transition:background .6s var(--ease),color .6s var(--ease);-webkit-user-select:none;user-select:none;min-height:100vh;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--mut)}
#app,#lobby{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);transition:opacity .7s var(--ease),transform .7s var(--ease)}
#app{position:relative;width:100%;min-height:100vh;opacity:0;transform:scale(.97);pointer-events:none}
body.in #app{opacity:1;transform:none;pointer-events:auto}
body.in #lobby{opacity:0;transform:scale(1.04);pointer-events:none}
#lobby{position:fixed;inset:0;justify-content:center;align-items:center;gap:14px;z-index:2}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;transition:background .6s var(--ease),border-color .6s var(--ease)}
.btn{border:0;border-radius:14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:transform .5s var(--ease),background .5s var(--ease),opacity .5s}
.btn:active{transform:scale(.94);opacity:.8}
.btn.p{background:var(--ac);color:var(--bg);border-color:transparent}
.ic{width:30px;height:30px;flex:none;display:grid;place-items:center;padding:0;border-radius:10px;background:var(--card);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:transform .5s var(--ease)}
.ic:active{transform:scale(.9)}
.ic svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=number]{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:16px;font-family:inherit;outline:0;-webkit-user-select:text;user-select:text;transition:border-color .4s var(--ease),box-shadow .4s var(--ease)}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
input:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px}
.top b{letter-spacing:.25em;color:var(--ac);font-family:ui-monospace,Menlo,monospace;font-size:14px}
.chip{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:#e0a030;transition:background .5s}
.dot.on{background:var(--ac)}
#stage{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;width:100%;flex:none;direction:ltr}
#stage.pfs{position:fixed;inset:0;z-index:50;border-radius:0;aspect-ratio:auto;height:100%}
#stage:fullscreen{border-radius:0;aspect-ratio:auto}
#stage:-webkit-full-screen{border-radius:0}
video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
video::cue{font-size:1.1em}
#ctl{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;gap:8px;align-items:center;color:#fff;font-size:12px;transition:opacity .6s var(--ease)}
#ctl button{background:none;border:0;color:#fff;font-size:18px;min-width:30px;cursor:pointer;transition:transform .4s var(--ease)}
#ctl button:active{transform:scale(.8)}
#ctl .t{font-variant-numeric:tabular-nums;white-space:nowrap}
#seek{flex:1;accent-color:#4de08f;min-width:0}
.spdw{position:relative;flex:none}
.spdbtn,.spdm button{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;font:inherit;font-size:12px;cursor:pointer}
.spdbtn{padding:3px 8px;min-width:38px}
.spdm{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) translateY(6px);display:flex;flex-direction:column;gap:3px;padding:5px;border-radius:12px;background:rgba(20,26,24,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid #ffffff30;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:12;white-space:nowrap}
.spdw.open .spdm{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.spdm button{padding:5px 12px;border-radius:9px;text-align:center}
.spdm button.on{background:rgba(77,224,143,.85);color:#0a0d0c;border-color:transparent}
#stage.idle #ctl{opacity:0}
#ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;text-align:center;padding:20px;pointer-events:none}
#dl{position:absolute;top:0;left:0;right:0;height:3px;background:#fff3;display:none}#dl.on{display:block}#dl i{display:block;height:100%;width:0;background:#4de08f;transition:width .5s var(--ease)}
#bf{position:absolute;top:8px;left:10px;background:rgba(20,26,24,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;border-radius:12px;padding:2px 10px;font-size:12px;display:none;direction:ltr}
#bub{position:absolute;left:12px;right:12px;bottom:56px;display:none;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.fs #bub.on,.pfs #bub.on{display:flex}
.bb{max-width:70%;background:rgba(20,26,24,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;padding:6px 12px;border-radius:18px;font-size:14px;animation:bi .7s var(--ease);transition:opacity .8s,transform .8s var(--ease)}
.bb.out{opacity:0;transform:translateY(-10px)}.bb.me{align-self:flex-end}.bb span{unicode-bidi:plaintext}
.bb i{color:#4de08f;font-style:normal;font-size:11px;display:block}
@keyframes bi{from{opacity:0;transform:translateY(20px) scale(.9)}}
#fsin{position:absolute;right:14px;left:auto;bottom:62px;width:min(340px,46vw);display:none;direction:rtl;flex-direction:row-reverse;align-items:center;gap:4px;padding:5px 6px;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.28);border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.28);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.fs #fsin,.pfs #fsin{display:flex}
.fs #fsin.hide,.pfs #fsin.hide{opacity:0;pointer-events:none;transform:translateY(10px)}
#fsin input{flex:1;min-width:0;background:transparent;color:#fff;border:0;border-radius:18px;padding:6px 10px;font-size:16px;outline:0}
#fsin input:focus{border:0;box-shadow:none}
#fsd{width:34px;height:34px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:16px;background:var(--ac);color:var(--bg);cursor:pointer}
#fsd svg{width:17px;height:17px;fill:currentColor}
.fs #bub,.pfs #bub{bottom:120px}
#subov{position:absolute;left:8%;right:8%;bottom:52px;text-align:center;color:#fff;font-size:clamp(14px,3vw,24px);line-height:1.35;pointer-events:none;text-shadow:0 2px 4px #000,0 0 10px #000;z-index:6;white-space:pre-line;direction:rtl}
.fs #subov,.pfs #subov{bottom:172px}
#subov:empty{display:none}
.src{margin:10px 0 6px}
.src .row{margin-bottom:6px}
.adv{overflow:hidden;max-height:0;opacity:0;transition:max-height .7s var(--ease),opacity .6s var(--ease)}
.adv.open{max-height:min(72vh,520px);opacity:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.adv .card{margin-bottom:6px;display:grid;gap:8px}
.sw{position:relative;width:51px;height:31px;flex:none;display:inline-block}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:var(--bd);border-radius:31px;transition:background .5s var(--ease)}
.sw span:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0004;transition:transform .5s var(--ease),width .3s}
.sw input:checked+span{background:#34c759}
.sw input:checked+span:after{transform:translateX(20px)}
.sw:active span:after{width:33px}
.sw input:checked:active+span:after{transform:translateX(14px)}
.sp{justify-content:space-between}
#chat{direction:ltr;flex:1;min-height:200px;display:flex;flex-direction:column;gap:6px;padding:10px}
.m{max-width:82%;width:fit-content;align-self:flex-start;animation:mi .6s var(--ease);touch-action:pan-y}
.m.me{align-self:flex-end}.m.me .act{margin-left:auto}.m.me .rs{justify-content:flex-end}.b{unicode-bidi:plaintext}
@keyframes mi{from{opacity:0;transform:translateY(14px) scale(.95)}}
.b{background:var(--bd);border-radius:18px;padding:6px 11px;width:fit-content;max-width:100%;word-break:break-word;-webkit-user-select:text;user-select:text;white-space:pre-wrap;transition:transform .5s var(--ease)}
.m.me .b{background:var(--me);color:#fff}
.m:not(.me) .b{background:var(--mc,var(--bd));color:#fff}
.m:active .b{transform:scale(.97)}
.n{font-size:11px;color:var(--mut);margin:0 8px}
.q{font-size:12px;opacity:.75;border-inline-start:3px solid var(--ac);padding:1px 8px;margin:0 4px 2px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{display:flex;gap:4px;margin:2px 6px;flex-wrap:wrap}
.rs span{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0 7px;font-size:13px;animation:mi .5s var(--ease)}
.rs span.me{border-color:var(--ac)}
.act{display:flex;gap:2px;max-height:0;opacity:0;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:20px;width:0;transition:max-height .5s var(--ease),opacity .4s,margin .5s var(--ease),width .4s var(--ease)}
.act.open{max-height:44px;opacity:1;margin:4px 0;width:max-content}
.act button{background:none;border:0;font-size:19px;padding:4px 7px;cursor:pointer;color:var(--tx);transition:transform .4s var(--ease)}
.act button:active{transform:scale(1.4)}
#rep{display:none;align-items:center;justify-content:space-between;font-size:12px;padding:4px 12px;border-inline-start:3px solid var(--ac);margin-bottom:6px;color:var(--mut)}
#rep.on{display:flex}
.comp{display:flex;gap:8px;padding:6px 0 8px}
[dir=rtl] .comp{flex-direction:row-reverse}
#sd{width:44px;height:40px;flex:none;display:grid;place-items:center;padding:0}
#sd svg{width:20px;height:20px;fill:currentColor}
.sys{align-self:center;font-size:12px;color:var(--mut)}
#ov{position:fixed;inset:0;z-index:99;pointer-events:none;opacity:0;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);background:color-mix(in srgb,var(--bg) 40%,transparent);transition:opacity .6s var(--ease)}
#ov.on{opacity:1}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-80px);background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:8px 16px;z-index:100;transition:transform .7s var(--ease);font-size:13px;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
.code{font:700 34px ui-monospace,Menlo,monospace;letter-spacing:.3em;color:var(--ac);direction:ltr}
#lobby .card{width:min(380px,100%);display:grid;gap:10px}
@media (min-aspect-ratio:1/1){
#stage{width:100%;max-height:calc(100vh - 60px);margin-inline:auto}
#stage.pfs,#stage:fullscreen,#stage:-webkit-full-screen{width:100%;max-height:none;aspect-ratio:auto;margin:0}
.adv.open{max-height:min(38vh,520px)}
}
</style>
</head>
<body>
<div id="ov"></div><div id="toast"></div>

<section id="lobby">
  <div style="text-align:center"><div class="top" style="justify-content:center"><b>WATCH PARTY</b></div><div class="mono" data-i="tag"></div></div>
  <div class="card">
    <input type="text" id="nm" data-p="name" maxlength="20" autocomplete="off">
    <button class="btn p" id="mk" data-i="create"></button>
    <div class="mono" style="text-align:center" data-i="or"></div>
    <input type="text" id="jc" data-p="code" maxlength="6" autocapitalize="characters" autocomplete="off" style="text-align:center;letter-spacing:.3em;direction:ltr">
    <button class="btn" id="jn" data-i="join"></button>
  </div>
  <div class="row"><button class="btn" id="l1" data-act="lang"></button><button class="btn" data-act="theme" data-i="theme"></button></div>
</section>

<section id="app">
  <div class="top">
    <b>WATCH PARTY</b>
    <div class="row"><div class="chip"><span class="dot" id="dot"></span><span id="st"></span></div>
    <button class="btn" id="cp" style="padding:4px 10px;font-family:ui-monospace,monospace;direction:ltr"></button>
    <button class="ic" data-act="theme" data-i="theme" aria-label="Theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
    <button class="ic" data-act="lang" data-i="lang" aria-label="Language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg></button>
    <button class="ic" id="del" data-i="delroom" title="حذف روم" aria-label="Delete room"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button></div>
  </div>

  <div id="stage">
    <video id="v" playsinline webkit-playsinline preload="auto"></video>
    <div id="ph" data-i="ph"></div>
    <div id="dl"><i></i></div><div id="bf"></div><div id="subov"></div><div id="bub"></div>
    <div id="fsin"><input type="text" id="fsm" data-p="msg" autocomplete="off"><button id="fsd" data-i="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M3 20.5l18-8.5L3 3.5l3.2 7.2L15 12 6.2 13.3 3 20.5z"/></svg></button></div>
    <div id="ctl">
      <button id="pp">▶</button><span class="t" id="tc">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span class="t" id="td">0:00</span>
      <div class="spdw" id="spdw"><button class="spdbtn" id="spd" aria-label="Speed">1×</button><div class="spdm" id="spdm"><button data-v="0.5">0.5×</button><button data-v="0.75">0.75×</button><button data-v="1" class="on">1×</button><button data-v="1.25">1.25×</button><button data-v="1.5">1.5×</button><button data-v="2">2×</button></div></div>
      <button id="cc" style="font-size:13px">CC</button>
      <button id="fb">⛶</button>
    </div>
  </div>

  <div class="src">
    <div class="row"><input type="text" id="url" data-p="url" dir="ltr" autocomplete="off" autocapitalize="off"><button class="btn p" id="go" data-i="load"></button></div>
    <div class="row">
      <label class="btn" style="flex:1;text-align:center"><span data-i="file"></span><input id="file" type="file" accept="video/*,audio/*,.mkv,.mp4,.m4v,.webm,.avi,.mov,.ts,.m3u8,.ogv,.flv,.wmv,.3gp" hidden></label>
      <button class="btn" id="adb" data-i="adv"></button>
    </div>
    <div class="adv" id="adv"><div class="card">
      <div class="mono" data-i="sub"></div>
      <div class="row"><input type="text" id="su" data-p="subu" dir="ltr" autocapitalize="off"><button class="btn" id="sg" data-i="load"></button></div>
      <label class="btn" style="text-align:center"><span data-i="subf"></span><input id="sf" type="file" accept=".srt,.vtt,.ass,.txt" hidden></label>
      <div class="row sp"><span data-i="bub"></span><label class="sw"><input type="checkbox" id="bs" checked><span></span></label></div>
      <div class="row sp"><span data-i="cs"></span><label class="sw"><input type="checkbox" id="cs"><span></span></label></div>
    </div></div>
  </div>

  <div class="card" style="flex:1 0 auto;min-height:240px;display:flex;flex-direction:column;padding:4px">
    <div id="chat"></div>
    <div id="rep"><span id="rt"></span><button class="btn" id="rx" style="padding:0 10px">✕</button></div>
    <div class="comp"><input type="text" id="msg" data-p="msg" autocomplete="off"><button class="btn p" id="sd" data-i="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M3 20.5l18-8.5L3 3.5l3.2 7.2L15 12 6.2 13.3 3 20.5z"/></svg></button></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const D={
fa:{tag:"تماشای دو نفره با چت",name:"نام شما",code:"کد روم",create:"ساخت روم جدید",or:"یا",join:"ورود به روم",theme:"تم",ph:"یک فایل یا لینک انتخاب کنید",load:"پخش",file:"فایل ویدیو",adv:"پیشرفته",sync:"همگام",sub:"زیرنویس",subf:"فایل زیرنویس (srt/vtt)",off:"تنظیم تفاوت زمان (من نسبت به او)",apply:"اعمال",bub:"حباب چت در تمام‌صفحه",auto:"همگام‌سازی خودکار",send:"ارسال",msg:"پیام...",url:"لینک ویدیو یا صفحه فیلم",subu:"لینک زیرنویس",lang:"English",wait:"منتظر ورود نفر دوم",con:"متصل",dis:"قطع شد",copied:"کد کپی شد",reply:"پاسخ",joined:"به روم پیوست",joining:"در حال ورود به روم...",err:"روم پیدا نشد",limit:"حداکثر ۵ پیام در ۳ ثانیه",spam:"اسپم تشخیص داده شد؛ ورودی پیام ۱ دقیقه قفل شد",locked:"قفل به مدت",delroom:"حذف روم",delconfirm:"روم و تمام چت هایش حذف شود؟",deleted:"روم حذف شد",res:"در حال پیدا کردن لینک ویدیو...",pick:"طرف مقابل فایل را پخش کرد؛ همان فایل را انتخاب کنید",bad:"این فرمت/کدک در مرورگر پشتیبانی نمی‌شود",full:"روم پر است",bt:"بافر قبل از پخش (نت ضعیف)",cs:"دانلود کامل با چند اتصال، بعد پخش",bufing:"در حال بافر",pw:"منتظر آماده شدن طرف مقابل",recv:"دریافت فایل",sndf:"ارسال فایل",big:"فایل خیلی بزرگ است؛ طرف مقابل باید همان فایل را انتخاب کند",nocache:"دانلود چندبخشی ممکن نیست؛ پخش مستقیم"},
en:{tag:"Watch together with chat",name:"Your name",code:"Room code",create:"Create new room",or:"or",join:"Join room",theme:"Theme",ph:"Pick a file or paste a link",load:"Play",file:"Video file",adv:"Advanced",sync:"Sync",sub:"Subtitles",subf:"Subtitle file (srt/vtt)",off:"Time offset (me vs. them)",apply:"Apply",bub:"Chat bubbles in fullscreen",auto:"Auto sync",send:"Send",msg:"Message...",url:"Video or page link",subu:"Subtitle link",lang:"فارسی",wait:"Waiting for partner",con:"Connected",dis:"Disconnected",copied:"Code copied",reply:"Reply",joined:"joined the room",joining:"Joining room...",err:"Room not found",limit:"Max 5 messages per 3 seconds",spam:"Spam detected; message input locked for 1 minute",locked:"Locked for",delroom:"Delete room",delconfirm:"Delete this room and all its chats?",deleted:"Room deleted",res:"Finding the video link...",pick:"Partner started a file; pick the same file",bad:"Format/codec not supported by this browser",full:"Room is full",bt:"Pre-buffer before play (slow net)",cs:"Parallel full download, then play",bufing:"Buffering",pw:"waiting for partner",recv:"Receiving file",sndf:"Sending file",big:"File too large to send; partner must pick the same file",nocache:"Parallel download unavailable; streaming directly"}};
let L=localStorage.l||"fa",AJT=null,S={ws:null,members:0,spam:{},block:{},mt:[],host:false,app:false,reply:null,hls:null,dash:null};

function showFsInput(){const e=$("#fsin");if(!isFs()){e.classList.remove("hide");return}
e.classList.remove("hide");clearTimeout(FST);FST=setTimeout(()=>{if(document.activeElement!==$("#fsm"))e.classList.add("hide")},4500)}
function fsState(){const on=isFs();stage.classList.toggle("fs",!!on);$("#bub").classList.toggle("on",$("#bs").checked);
if(on)showFsInput();else{$("#fsin").classList.add("hide");clearTimeout(FST)}}
$("#fb").onclick=()=>{if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen||(()=>{})).call(document);stage.classList.remove("pfs");fsState();return}
const r=stage.requestFullscreen||stage.webkitRequestFullscreen;
if(r)r.call(stage).catch(()=>{stage.classList.add("pfs");fsState()});else{stage.classList.add("pfs");fsState()}
if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("landscape").catch(()=>{})};
["fullscreenchange","webkitfullscreenchange"].forEach(e=>document.addEventListener(e,fsState));
$("#bs").onchange=fsState;
/* ---------- chat ---------- */
const E=["❤️","😂","👍","😮","😢","🔥"],M={},RX={};
const uid=()=>Math.random().toString(36).slice(2,9);
const colorOf=s=>{let h=0;for(const c of String(s||"?"))h=(h*31+c.charCodeAt(0))|0;return "hsl("+(Math.abs(h)%360)+" 46% 38%)"};
function lockInput(ms){const until=Date.now()+ms;const apply=()=>{const left=Math.max(0,until-Date.now()),dis=left>0;
$("#msg").disabled=dis;$("#fsm").disabled=dis;$("#sd").disabled=dis;$("#fsd").disabled=dis;
$("#msg").placeholder=dis?T("locked")+" "+Math.ceil(left/1000)+"s":T("msg");if(dis)setTimeout(apply,1000)};apply()}
function spamCheck(m,mine){const k=m.n||"?",t=Date.now();if((S.block[k]||0)>t){if(mine)lockInput(S.block[k]-t);return false}
const a=(S.spam[k]||[]).filter(x=>t-x<10000);a.push(t);S.spam[k]=a;
if(a.length>=50){S.block[k]=t+60000;if(mine)lockInput(60000);toast(T("spam"));if(!mine)sys(k+" · "+T("spam"));return false}return true}
function sys(t){const d=document.createElement("div");d.className="sys";d.textContent=t;$("#chat").append(d);scr()}
const scr=()=>{const c=$("#chat");if(c.scrollHeight>c.clientHeight+2)c.scrollTo({top:c.scrollHeight,behavior:"smooth"});
const near=(innerHeight+scrollY)>=(document.documentElement.scrollHeight-140);if(near)window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"})};
function startReply(m){S.reply=m;$("#rt").textContent="↩ "+m.x.slice(0,50);$("#rep").classList.add("on");$("#msg").focus();$$(".act.open").forEach(x=>x.classList.remove("open"))}
function addMsg(m,mine,hist){M[m.id]=m;const d=document.createElement("div");d.className="m"+(mine?" me":"");d.id="m"+m.id;
let h="";if(!mine)h+=`<div class="n"></div>`;if(m.q)h+=`<div class="q"></div>`;
h+=`<div class="b"></div><div class="rs"></div><div class="act"></div>`;d.innerHTML=h;
if(!mine){d.querySelector(".n").textContent=m.n;d.style.setProperty("--mc",m.c||colorOf(m.n))}if(m.q)d.querySelector(".q").textContent=m.q;
d.querySelector(".b").textContent=m.x;
const a=d.querySelector(".act");a.innerHTML=`<button data-r>↩︎</button>`+E.map(e=>`<button data-e="${e}">${e}</button>`).join("");
d.querySelector(".b").onclick=()=>{$$(".act.open").forEach(x=>x!==a&&x.classList.remove("open"));a.classList.toggle("open")};
let sx=0,sy=0;
d.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
d.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
if(dx<-45&&Math.abs(dx)>Math.abs(dy)*1.4){startReply(m);navigator.vibrate&&navigator.vibrate(15)}},{passive:true});
a.onclick=e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.r!==undefined){startReply(m)}else react(m.id,b.dataset.e,true);a.classList.remove("open")};
$("#chat").append(d);scr();showFsInput();
if(!mine&&!hist){bubble(m.n,m.x)}}
function react(id,e,mine){const r=RX[id]=RX[id]||{};const k=r[e]=r[e]||{me:0,o:0};
if(mine){k.me=k.me?0:1;send({t:"re",id,e})}else k.o=k.o?0:1;
const box=$("#m"+id+" .rs");if(!box)return;box.innerHTML="";
for(const x in r){const n=r[x].me+r[x].o;if(n){const s=document.createElement("span");s.className=r[x].me?"me":"";s.textContent=x+(n>1?" "+n:"");box.append(s)}}}
function bubble(n,x,mine){if(!$("#bs").checked)return;const b=document.createElement("div");b.className="bb"+(mine?" me":"");b.innerHTML="<i></i><span></span>";
b.firstChild.textContent=n;b.lastChild.textContent=x;$("#bub").append(b);
setTimeout(()=>b.classList.add("out"),6000);setTimeout(()=>b.remove(),6900)}
function say(x){x=x.trim();if(!x)return;const t=Date.now();S.mt=S.mt.filter(z=>t-z<3000);
if(S.mt.length>=5){toast(T("limit"));return}S.mt.push(t);
const m={t:"chat",id:uid(),n:name(),x,q:S.reply?S.reply.x.slice(0,60):"",c:colorOf(name())};
if(!spamCheck(m,true))return;
send(m);addMsg(m,true);bubble(m.n,x,true);S.reply=null;$("#rep").classList.remove("on")}
$("#sd").onclick=()=>{say($("#msg").value);$("#msg").value=""};
$("#msg").onkeydown=e=>{if(e.key=="Enter"){$("#sd").click()}};
$("#fsm").onkeydown=e=>{if(e.key=="Enter"){say(e.target.value);e.target.value=""}};
$("#fsd").onclick=()=>{say($("#fsm").value);$("#fsm").value=""};
$("#fsm").addEventListener("focus",()=>{clearTimeout(FST);$("#fsin").classList.remove("hide")});
$("#fsm").addEventListener("blur",()=>{clearTimeout(FST);FST=setTimeout(()=>$("#fsin").classList.add("hide"),2500)});
$("#rx").onclick=()=>{S.reply=null;$("#rep").classList.remove("on")};
$("#mk").onclick=hostRoom;$("#jn").onclick=()=>joinRoom($("#jc").value);
$("#del").onclick=()=>{if(confirm(T("delconfirm")))send({t:"delete",secret:roomSecret()})};
$("#jc").onkeydown=e=>{if(e.key=="Enter")joinRoom(e.target.value)};
async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}}catch(e){}
const a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");a.style.cssText="position:fixed;top:0;left:-9999px;opacity:0";document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,a.value.length);let ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();return ok}
$("#cp").onclick=async()=>{const ok=await copyText(S.code);toast(ok?T("copied"):S.code)};
$("#jc").onclick=e=>{if(e.target.value)e.target.select()};
const q=new URLSearchParams(location.search).get("room")||location.hash.slice(1)||localStorage.room||"";
if(q){$("#jc").value=q.toUpperCase();if(localStorage.n){$("#nm").value=localStorage.n;AJT=setTimeout(()=>joinRoom(q),250)}}
fsState();
</script>
</body>
</html>
